# =============================================================================
# Fluxo 2 (OPCIONAL) — secrets de aplicacao via Infisical Secrets Operator
# =============================================================================
# Sincroniza secrets de um projeto de Secrets Management para o Secret K8s
# corebank-app-env (consumido pelo httpbin-corebank via envFrom).
#
# Requer: secrets-operator instalado, um projeto de Secrets Management com a
# Machine Identity (infisical-operator-auth) e a pasta/keys configuradas.
# Se voce so quer o demo de cert+mTLS, pule isto e crie um stub:
#   kubectl create secret generic corebank-app-env \
#     --from-literal=DB_URL="stub://placeholder" -n corebank-apps
# -----------------------------------------------------------------------------
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: corebank-app-secrets
  namespace: corebank-apps
spec:
  hostAPI: http://infisical-lb.infisical.svc.cluster.local/api
  syncConfig:
    resyncInterval: "1m"   # operator novo exige string (duração)
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "gzbank-secrets-sh-nd"
        envSlug: "dev"
        secretsPath: "/"      # variaveis na raiz (1 projeto Infisical por app)
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: corebank-apps
  managedKubeSecretReferences:
    - secretName: corebank-app-env
      secretNamespace: corebank-apps
      creationPolicy: "Owner"
